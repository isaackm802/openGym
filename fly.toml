# Fly.io deployment for this fork. Image: deploy/fly/Dockerfile (nginx + API in one machine).
app = "opengym-isaackm"
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  # Passkeys are bound to this exact hostname. Change both if you add a custom domain.
  RP_ID = "opengym-isaackm.fly.dev"
  ORIGIN = "https://opengym-isaackm.fly.dev"
  RP_NAME = "openGym"
  # Owner registered 2026-10-18. New profiles need an invite code from the admin dashboard.
  FIRST_USER_ADMIN = "1"
  INVITE_ONLY = "1"
  ALLOW_GUEST = "0"
  # nginx overwrites X-Forwarded-For with Fly's client IP header, so the API can trust it.
  TRUST_PROXY = "1"

[[mounts]]
  source = "opengym_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep it running: the server sends rest-timer pushes and reminders on its own schedule.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
